name: Stat cards

# Renders the GitHub stats + language SVGs INSIDE the Action, straight from
# GitHub's API (jstrieb/github-stats). There is no third-party card service in
# the loop, so there's nothing to 503 on — the generated SVGs are committed into
# images/ and served by GitHub itself. Runs daily, on demand, and on pushes to main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "images/**"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout stats generator
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          ref: master
          path: .stats-generator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator deps
        # jstrieb/github-stats ships a Pipfile (pipenv), not requirements.txt —
        # install its runtime dependencies directly.
        run: pip install --no-cache-dir aiohttp requests

      - name: Generate stat SVGs
        working-directory: .stats-generator
        env:
          # Classic PAT (scopes: repo, read:user) stored as the GH_STATS_TOKEN secret.
          # This is the one manual step — see the setup notes.
          ACCESS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_ACTOR: Gerrrt
          EXCLUDE_FORKED_REPOS: "true"
        run: python generate_images.py

      - name: Publish into images/
        run: |
          mkdir -p images
          cp .stats-generator/generated/overview.svg  images/overview.svg
          cp .stats-generator/generated/languages.svg images/languages.svg

      - name: Commit refreshed stats
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/overview.svg images/languages.svg
          if git diff --cached --quiet; then
            echo "stats unchanged"
          else
            git commit -m "chore: refresh stats [skip ci]"
            git push
          fi
