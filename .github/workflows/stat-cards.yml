name: Metrics

# Renders a GitHub metrics SVG with lowlighter/metrics. It talks straight to
# GitHub's API inside the Action (no third-party card service to be down) and
# commits github-metrics.svg into the repo, which GitHub then serves directly.
#
# - Data is fetched with a PAT (secrets.METRICS_TOKEN) so the card can reach
#   beyond the handful of repos the Gerrrt account personally owns and include
#   repos in orgs/accounts Gerrrt belongs to (dotgibson, ezekiellabs). If that
#   secret is not set it falls back to the built-in GITHUB_TOKEN (public data
#   for the Gerrrt account only) so the workflow still succeeds.
#   The PAT must be a classic token with `repo` + `read:org` scopes, and Gerrrt
#   must be owner/member/collaborator on the repos to be counted.
# - Commits are made with the built-in GITHUB_TOKEN so the refresh commit is
#   authored by github-actions, not the PAT owner.
# - extras_css paints the card in a Tokyo Night dark palette.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "github-metrics.svg"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # PAT for data (reaches org/collaborator repos); built-in token for the
          # commit. Falls back to the built-in token if METRICS_TOKEN is unset.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Gerrrt

          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh github metrics [skip ci]"

          # Count repos Gerrrt owns, collaborates on, or shares an org with —
          # not just personally-owned ones (needs the PAT's repo + read:org scopes).
          repositories_affiliations: owner, collaborator, organization_member

          # Exclude private repos from the card. metrics has no "public only"
          # toggle, so private repos are listed explicitly here (applies to every
          # plugin, including the language breakdown). These are the private repos
          # that were skewing the language bar with PHP/PowerShell. If a new
          # private repo is created, add it here too.
          repositories_skipped: |
            Gerrrt/Lemmiwinks
            Gerrrt/secctbt-site
            Gerrrt/PEN300

          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Tokyo Night dark tint. Inline-colored marks (language dots, the
          # contribution calendar) keep their own colors because inline fills
          # win over these CSS rules.
          extras_css: |
            svg { background-color: #1a1b26; color: #c0caf5; }
            h1, h2, h3 { color: #7aa2f7 !important; }
            .field { color: #c0caf5 !important; }
            .field svg { fill: #7aa2f7; }
            small, .field.language.details small, .field.license.details small { color: #a9b1d6 !important; }
            footer, footer div, footer span, footer a { color: #565f89 !important; }
            .calendar .day { outline-color: rgba(255,255,255,0.06) !important; }
