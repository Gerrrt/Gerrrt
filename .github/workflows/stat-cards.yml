name: Metrics

# Renders a GitHub metrics SVG with lowlighter/metrics. It talks straight to
# GitHub's API inside the Action (no third-party card service to be down) and
# commits github-metrics.svg into the repo, which GitHub then serves directly.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "github-metrics.svg"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT (scopes: repo, read:user) stored as GH_STATS_TOKEN.
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: Gerrrt
          filename: github-metrics.svg

          # Commit the rendered SVG back to main.
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh github metrics [skip ci]"

          # Content.
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
