name: Stat cards

# Renders GitHub stats + language SVGs with jstrieb/github-stats — a prebuilt
# binary that talks straight to GitHub's API, so there's no third-party card
# service to 503 on. Its SVGs auto-adapt to light/dark and are committed into
# images/, so GitHub serves real files. Runs daily, on demand, and on push to main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "images/**"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Download github-stats binary
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o github-stats \
            https://github.com/jstrieb/github-stats/releases/latest/download/github-stats_x86_64-linux
          chmod +x github-stats

      - name: Generate stat SVGs
        env:
          # Classic PAT (scopes: repo, read:user, user:email) stored as GH_STATS_TOKEN.
          ACCESS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          # Public contributions only. Set to "false" to include private ones
          # (aggregate numbers only — private repo names are never shown).
          EXCLUDE_PRIVATE: "true"
          SILENT: "true"
          MAX_RETRIES: "5"
        run: |
          set -euo pipefail
          ./github-stats
          echo "=== SVGs produced ==="
          find . -name '*.svg' -not -path './images/*'

      - name: Publish into images/
        run: |
          set -euo pipefail
          mkdir -p images
          ov=$(find . -name overview.svg  -not -path './images/*' | head -n1)
          lg=$(find . -name languages.svg -not -path './images/*' | head -n1)
          echo "overview=$ov  languages=$lg"
          cp "$ov" images/overview.svg
          cp "$lg" images/languages.svg

      - name: Commit refreshed stats
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/overview.svg images/languages.svg
          if git diff --cached --quiet; then
            echo "stats unchanged"
          else
            git commit -m "chore: refresh stats [skip ci]"
            git push
          fi
